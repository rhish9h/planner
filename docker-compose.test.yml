services:
  test-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: planner_test
      POSTGRES_USER: planner_test
      POSTGRES_PASSWORD: planner_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planner_test -d planner_test"]
      interval: 2s
      timeout: 5s
      retries: 20

  tests:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://planner_test:planner_test@test-db:5432/planner_test
      TEST_DATABASE_URL: postgresql+psycopg://planner_test:planner_test@test-db:5432/planner_test
    depends_on:
      test-db:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && pytest tests -q"]
